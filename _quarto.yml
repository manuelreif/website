project:
  type: website
  render:
    - "*.qmd"
    - "!dontgit/"
    - "!cv"
  resources:
    - "fonts/*"
    - "fonts/licenses/*"
  post-render:
    - scripts/local-fonts.ts

website:
  title: "Manuel Reif"
  site-url: https://manuelreif.at
  description: "Manuels Website und Blog zu höchstpersönlichen Data Science Themen"
  # Google Analytics kommt über theme/analytics.html und läuft erst nach Zustimmung
  cookie-consent:
    type: express
    style: simple
    language: de
    policy-url: /impressum.html#datenschutz
    prefs-text: "Cookie-Einstellungen"
  open-graph: true
  twitter-card: true
  page-footer:
    left: "{{< fa copyright >}} 2026 Manuel Reif | site made with quarto"
    right:
        - icon: github
          href: https://github.com/manuelreif/website
  navbar:
    search: true
    logo: media/logo.webp
    left:
      - href: index.qmd
        text: Home
      - href: cv.qmd
        text: CV
      - href: pkgs.qmd
        text: R-Packages
      - href: blog.qmd
        text: Blog {{< fa blog >}}
    right: 
      - href: impressum.qmd
        text: Impressum 
      - icon: rss
        href: blog.xml
        
format:
  html:
    theme:
      light: [cosmo, theme/rules.scss, theme/light.scss]
      dark: [cosmo, theme/rules.scss, theme/dark.scss]
    css: fonts/fonts.css
    include-in-header: theme/analytics.html
    toc: true

lang: de

highlight-style: monokai

execute: 
  freeze: auto

